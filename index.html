<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProjectTool</title>
<meta http-equiv="Cache-Control" content="no-store">
<style>
  html,body{margin:0;height:100%;background:#0d1520;color:#8899aa;
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #l{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:12px;padding:20px;text-align:center}
  b{color:#5eead4;font-size:17px;letter-spacing:.3px}
  #f{color:#e0556b;max-width:340px;display:none}
  a{color:#5eead4}
</style>
</head>
<body>
<div id="l">
  <b>ProjectTool</b>
  <div id="s">wird geladen …</div>
  <div id="f"></div>
</div>
<script>
/* Lader. Holt das Werkzeug bei jedem Oeffnen frisch.
   Der Zeitstempel haengt an der Adresse — damit kann kein
   Zwischenspeicher eine alte Fassung festhalten. */
(async function(){
  const s=document.getElementById("s"), f=document.getElementById("f");
  try{
    const r=await fetch("tool.html?"+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("Server meldet "+r.status);
    const html=await r.text();
    if(!/ProjectTool/.test(html)) throw new Error("Antwort sieht nicht nach dem Werkzeug aus");
    document.open(); document.write(html); document.close();
  }catch(e){
    s.textContent="Konnte das Werkzeug nicht laden.";
    f.style.display="block";
    f.innerHTML=String(e.message)+
      '<br><br><a href="tool.html">Direkt öffnen</a>';
  }
})();
</script>
</body>
</html>
